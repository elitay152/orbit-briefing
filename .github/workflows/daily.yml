name: daily-snapshot

on:
  schedule:
    - cron: "17 6 * * *"     # every day at 06:17 UTC
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # lets the job push to the data branch

concurrency:
  group: daily-snapshot
  cancel-in-progress: false   # never run two snapshot jobs at once

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCATION_NAME: Seattle
      LAT: "47.6205"
      LON: "-122.3493"
      LAKE_DIR: ${{ github.workspace }}/lake-store/orbital_elements
    steps:
      - uses: actions/checkout@v4          # code (main)

      - uses: actions/checkout@v4          # data branch, into ./lake-store
        with:
          ref: data
          path: lake-store

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - id: install
        run: pip install -r requirements.txt

      - run: python -m orbit.pipeline.extract   # exits 1 if any constellation failed

      # load and commit whatever was fetched, even if one constellation failed;
      # the job still ends red so the failure gets noticed
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m orbit.pipeline.load

      - name: Commit new snapshots
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: lake-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new snapshots"
          else
            git commit -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi